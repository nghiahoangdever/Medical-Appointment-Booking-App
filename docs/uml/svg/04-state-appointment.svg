" x1="6" x2="113.124" y1="693.2188" y2="693.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.124" x="16" y="685.1426">COMPLETED</text></g><g id="CANCELLED"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="104.0273" x="754.5" y="334.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="754.5" x2="858.5273" y1="362.2188" y2="362.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.0273" x="764.5" y="354.1426">CANCELLED</text></g><g id="NO_SHOW"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="92.3379" x="462.5" y="505.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="462.5" x2="554.8379" y1="533.2188" y2="533.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="72.3379" x="472.5" y="525.1426">NO_SHOW</text></g><ellipse cx="527.5" cy="60.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="550.5" cy="784.6094" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="550.5" cy="784.6094" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="30" data-uid="ent0003" id="entity_GMN2"><path d="M877,338.1094 L877,355.6094 L858.8359,359.6094 L877,363.6094 L877,380.8125 A0,0 0 0 0 877,380.8125 L1197.8569,380.8125 A0,0 0 0 0 1197.8569,380.8125 L1197.8569,348.1094 L1187.8569,338.1094 L877,338.1094 A0,0 0 0 0 877,338.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1187.8569,338.1094 L1187.8569,348.1094 L1197.8569,348.1094 L1187.8569,338.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="299.8569" x="883" y="356.6045">CANCELLED frees the place (capacity counts every</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.106" x="883" y="372.9561">other status) but its queue number is never reused.</text></g><g class="entity" data-entity="GMN5" data-source-line="35" data-uid="ent0006" id="entity_GMN5"><path d="M131,644.6094 L131,736.3672 A0,0 0 0 0 131,736.3672 L521.5288,736.3672 A0,0 0 0 0 521.5288,736.3672 L521.5288,654.6094 L511.5288,644.6094 L282.2588,644.6094 L144.5921,555.1503 L274.2588,644.6094 L131,644.6094 A0,0 0 0 0 131,644.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M511.5288,644.6094 L511.5288,654.6094 L521.5288,654.6094 L511.5288,644.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369.5288" x="137" y="663.1045">No arrow IN_EXAMINATION -&gt; NO_SHOW: once the exam has</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="321.5659" x="137" y="679.4561">started the patient was there. Final states have no exits.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="319.6807" x="137" y="695.8076">Wrong status -&gt; 409 INVALID_STATUS_TRANSITION;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.6406" x="137" y="712.1592">wrong role -&gt; 403 ACTION_NOT_ALLOWED_FOR_ROLE;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.4434" x="137" y="728.5107">failed guard -&gt; 409 with the guard's code.</text></g><g class="link" data-entity-1=".start." data-entity-2="BOOKED" data-uid="lnk3" id="link_.start._BOOKED"><polygon fill="#181818" points="527.5,195.5549,531.5,186.5549,527.5,190.5549,523.5,186.5549,527.5,195.5549" style="stroke:#181818;stroke-width:1;"/><path d="M527.5,74.8285 C527.5,99.9789 527.5,155.339 527.5,189.5549" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.9326" x="611.7307" y="108.1045">book (Patient)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.394" x="529.5" y="124.4561">[date in today..today+13 &#8743; shift not started</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.2695" x="541.0623" y="140.8076">&#8743; no other active booking in date+shift</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.0405" x="540.1768" y="157.1592">&#8743; an on-duty roster entry has capacity]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.4487" x="537.4727" y="173.5107">/ queueNumber = nextQueueNumber++</text></g><g class="link" data-entity-1="BOOKED" data-entity-2="CANCELLED" data-uid="lnk4" id="link_BOOKED_CANCELLED"><polygon fill="#181818" points="754.2585,338.2772,746.7919,331.8546,749.4703,336.8371,744.4878,339.5156,754.2585,338.2772" style="stroke:#181818;stroke-width:1;"/><path d="M528.6117,246.03 C531.0249,268.1191 538.2619,299.6966 559.5,316.6094 C591.1196,341.7893 701.0887,325.6328 740.5,334.6094 C745.0174,335.6383 743.9022,335.1625 748.5127,336.5491" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.3208" x="624.7512" y="279.1045">cancel (Patient)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.8232" x="561.5" y="295.4561">[own appointment &#8743; before shift start]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.5952" x="588.614" y="311.8076">/ cancelledAt, cancelledById</text></g><g class="link" data-entity-1="BOOKED" data-entity-2="CANCELLED" data-uid="lnk5" id="link_BOOKED_CANCELLED"><polygon fill="#181818" points="806.4871,334.6077,809.9094,325.3725,806.1706,329.6177,801.9254,325.879,806.4871,334.6077" style="stroke:#181818;stroke-width:1;"/><path d="M567.5859,223.1858 C630.6131,226.4814 748.8732,236.2275 779.5,263.6094 C799.4406,281.4373 804.7249,306.8266 806.1073,328.6197" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.458" x="849.8735" y="287.6045">cancel (Receptionist, Admin)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.2051" x="806.5" y="303.9561">/ cancelledAt, cancelledById, cancelReason</text></g><g class="link" data-entity-1="BOOKED" data-entity-2="CHECKED_IN" data-uid="lnk6" id="link_BOOKED_CHECKED_IN"><polygon fill="#181818" points="295.9828,334.2411,297.8536,324.5715,294.857,329.3695,290.059,326.3729,295.9828,334.2411" style="stroke:#181818;stroke-width:1;"/><path d="M487.1915,223.2759 C429.3956,226.6033 327.4025,236.2847 304.5,263.6094 C288.2894,282.95 289.7473,307.26 294.6318,328.3951" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.6099" x="335.2644" y="279.1045">checkIn (Receptionist)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.1387" x="306.5" y="295.4561">[date = today &#8743; before shift end]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.7681" x="360.1853" y="311.8076">/ checkedInAt</text></g><g class="link" data-entity-1="BOOKED" data-entity-2="NO_SHOW" data-uid="lnk7" id="link_BOOKED_NO_SHOW"><polygon fill="#181818" points="509.2832,505.5748,513.5919,496.7184,509.456,500.5778,505.5966,496.4419,509.2832,505.5748" style="stroke:#181818;stroke-width:1;"/><path d="M525.0588,245.8335 C522.825,268.6994 519.5629,303.9549 517.5,334.6094 C513.3586,396.1504 510.7643,462.7506 509.4905,499.5784" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.3462" x="528.1995" y="357.1045">markNoShow (Receptionist, Doctor)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.7451" x="519.5" y="373.4561">[after shift start &#8743; (Doctor: own queue)]</text></g><g class="link" data-entity-1="CHECKED_IN" data-entity-2="IN_EXAMINATION" data-uid="lnk8" id="link_CHECKED_IN_IN_EXAMINATION"><polygon fill="#181818" points="66.6943,505.4923,67.9011,495.7176,65.2388,500.7088,60.2476,498.0465,66.6943,505.4923" style="stroke:#181818;stroke-width:1;"/><path d="M248.3926,362.8034 C187.5658,366.5187 95.3371,376.4235 73.5,402.6094 C49.6324,431.2301 56.4024,471.6698 64.9477,499.7521" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.9136" x="117.804" y="418.1045">start / callNext (Doctor)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.5205" x="106.0005" y="434.4561">[own queue &#8743; date = today</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.5215" x="75.5" y="450.8076">&#8743; no other patient IN_EXAMINATION</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.4644" x="95.0286" y="467.1592">for this doctor today (any shift)]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="59.249" x="154.6362" y="483.5107">/ startedAt</text></g><g class="link" data-entity-1="CHECKED_IN" data-entity-2="NO_SHOW" data-uid="lnk9" id="link_CHECKED_IN_NO_SHOW"><polygon fill="#181818" points="462.0851,525.2727,453.5953,520.2804,457.1172,524.