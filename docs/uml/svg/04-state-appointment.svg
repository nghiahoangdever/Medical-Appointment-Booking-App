8;stroke-width:0.5;" x1="112.45" x2="219.574" y1="771.0988" y2="771.0988"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.124" x="122.45" y="763.0226">COMPLETED</text></g><g id="CANCELLED"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="104.0273" x="7" y="368.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="111.0273" y1="396.2188" y2="396.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.0273" x="17" y="388.1426">CANCELLED</text></g><g id="NO_SHOW"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="92.3379" x="651.84" y="561.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="651.84" x2="744.1779" y1="589.2188" y2="589.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="72.3379" x="661.84" y="581.1426">NO_SHOW</text></g><ellipse cx="437.01" cy="54.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="166.01" cy="886.3694" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="166.01" cy="886.3694" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="30" data-uid="ent0003" id="entity_GMN2"><path d="M145.59,372.2594 L145.59,389.6094 L111.12,393.6094 L145.59,397.6094 L145.59,414.9625 A0,0 0 0 0 145.59,414.9625 L466.4469,414.9625 A0,0 0 0 0 466.4469,414.9625 L466.4469,382.2594 L456.4469,372.2594 L145.59,372.2594 A0,0 0 0 0 145.59,372.2594" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M456.4469,372.2594 L456.4469,382.2594 L466.4469,382.2594 L456.4469,372.2594" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="299.8569" x="151.59" y="390.7545">CANCELLED frees the place (capacity counts every</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.106" x="151.59" y="407.1061">other status) but its queue number is never reused.</text></g><g class="entity" data-entity="GMN5" data-source-line="35" data-uid="ent0006" id="entity_GMN5"><path d="M254.75,722.6094 L254.75,814.3672 A0,0 0 0 0 254.75,814.3672 L645.2788,814.3672 A0,0 0 0 0 645.2788,814.3672 L645.2788,732.6094 L635.2788,722.6094 L426.58,722.6094 L355.71,611.8694 L418.58,722.6094 L254.75,722.6094 A0,0 0 0 0 254.75,722.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M635.2788,722.6094 L635.2788,732.6094 L645.2788,732.6094 L635.2788,722.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369.5288" x="260.75" y="741.1045">No arrow IN_EXAMINATION -&gt; NO_SHOW: once the exam has</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="321.5659" x="260.75" y="757.4561">started the patient was there. Final states have no exits.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="319.6807" x="260.75" y="773.8076">Wrong status -&gt; 409 INVALID_STATUS_TRANSITION;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.6406" x="260.75" y="790.1592">wrong role -&gt; 403 ACTION_NOT_ALLOWED_FOR_ROLE;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.4434" x="260.75" y="806.5107">failed guard -&gt; 409 with the guard's code.</text></g><!--link *start* to BOOKED--><g class="link" data-entity-1=".start." data-entity-2="BOOKED" data-source-line="8" data-uid="lnk3" id="link_.start._BOOKED"><path d="M437.01,65.0694 C437.01,91.7094 437.01,161.9194 437.01,201.3394" fill="none" id="*start*-to-BOOKED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="437.01,207.3394,441.01,198.3394,437.01,202.3394,433.01,198.3394,437.01,207.3394" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.9326" x="520.2407" y="109.1045">book (Patient)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.394" x="438.01" y="125.4561">[date in today..today+13 &#8743; shift not started</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.2695" x="449.5723" y="141.8076">&#8743; no other active booking in date+shift</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.0405" x="448.6868" y="158.1592">&#8743; an on-duty roster entry has capacity]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.4487" x="445.9827" y="174.5107">/ queueNumber = nextQueueNumber++</text></g><!--link BOOKED to CANCELLED--><g class="link" data-entity-1="BOOKED" data-entity-2="CANCELLED" data-source-line="17" data-uid="lnk4" id="link_BOOKED_CANCELLED"><path d="M396.68,235.9794 C298.46,242.1394 53.06,260.1694 29.01,287.6094 C9.27,310.1394 22.0528,339.8335 37.2328,363.1135" fill="none" id="BOOKED-to-CANCELLED" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="40.51,368.1394,38.9448,358.4157,37.779,363.9511,32.2436,362.7853,40.51,368.1394" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.3208" x="93.2612" y="302.1045">cancel (Patient)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.8232" x="30.01" y="318.4561">[own appointment &#8743; before shift start]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.5952" x="57.124" y="334.8076">/ cancelledAt, cancelledById</text></g><!--link BOOKED to CANCELLED--><g class="link" data-entity-1="BOOKED" data-entity-2="CANCELLED" data-source-line="18" data-uid="lnk5" id="link_BOOKED_CANCELLED"><path d="M396.75,240.0794 C363.39,247.1094 316.22,261.0894 283.01,287.6094 C262.1,304.3094 272.72,322.9594 251.01,338.6094 C205.38,371.5294 181.98,352.6794 128.01,368.6094 C122.54,370.2294 122.5621,370.1523 116.9121,372.0023" fill="none" id="BOOKED-to-CANCELLED-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="111.21,373.8694,121.0079,374.8702,115.9618,372.3135,118.5185,367.2674,111.21,373.8694" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.458" x="327.3835" y="310.6045">cancel (Receptionist, Admin)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.2051" x="284.01" y="326.9561">/ cancelledAt, cancelledById, cancelReason</text></g><!--link BOOKED to CHECKED_IN--><g class="link" data-entity-1="BOOKED" data-entity-2="CHECKED_IN" data-source-line="19" data-uid="lnk6" id="link_BOOKED_CHECKED_IN"><path d="M477.31,245.5394 C499.88,254.0394 527.02,267.5594 545.01,287.6094 C565.53,310.4794 574.3891,339.2387 579.0791,362.3987" fill="none" id="BOOKED-to-CHECKED_IN" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="580.27,368.2794,582.4041,358.6645,579.2776,363.3788,574.5633,360.2523,580.27,368.2794" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.6099" x="601.9644" y="302.1045">checkIn (Receptionist)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.1387" x="573.2" y="318.4561">[date = today &#8743; before shift end]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.7681" x="626.8853" y="334.8076">/ checkedInAt</text></g><!--link BOOKED to NO_SHOW--><g class="link" data-entity-1="BOOKED" data-entity-2="NO_SHOW" data-source-line="20" data-uid="lnk7" id="link_BOOKED_NO_SHOW"><path d="M477.45,234.0694 C557.24,235.8994 730.48,244.8294 768.01,287.6094 C839.54,369.1494 822.46,435.0694 773.01,531.6094 C766.65,544.0394 760.8394,550.7717 749.4794,558.8517" fill="none" id="BOOKED-to-NO_SHOW" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="744.59,562.3294,754.2425,560.3725,748.6645,559.4313,749.6056,553.8533,744.59,562.3294" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.3462" x="825.6895" y="391.1045">markNoShow (Receptionist, Doctor)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.7451" x="816.99" y="407.4561">[after shift start &#8743; (Doctor: own queue)]</text></g><!--link CHECKED_IN to IN_EXAMINATION--><g class="link" data-entity-1="CHECKED_IN" data-entity-2="IN_EXAMINATION" data-source-line="21" data-uid="lnk8" id="link_CHECKED_IN_IN_EXAMINATION"><path d="M528.51,408.0794 C514.03,411.5494 498.45,415.2494 484.01,418.6094 C425,432.3494 390.55,402.6894 351.01,448.6094 C324.17,479.7894 327.7942,525.2637 333.7742,555.4537" fill="none" id="CHECKED_IN-to-IN_EXAMINATION" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="334.94,561.3394,337.115,551.7337,333.9685,556.4347,329.2675,553.2881,334.94,561.3394" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.9136" x="394.314" y="463.1045">start / callNext (Doctor)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.5205" x="382.5105" y="479.4561">[own queue &#8743; date = today</text><text fill="#000000" font-family="sans-ser